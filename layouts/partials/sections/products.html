<section id="products" class="section-products">
  <div class="container">
    <h2 class="section-heading">Our Creations</h2>
    <div class="products-grid">
      {{ $products := where .Site.RegularPages "Section" "products" }}
      {{ range sort $products ".Params.weight" }}
      <div class="product-card">
        <div class="product-image">
          <img src="{{ .Params.image }}" alt="{{ .Title }}" loading="lazy">
        </div>
        <div class="product-info">
          <h3>{{ .Title }}</h3>
          <p>{{ .Params.description }}</p>
          {{ with .Params.varieties }}
          <ul class="product-varieties">
            {{ range . }}
            <li>
              <button type="button" class="variety-chip"
                      data-variety="{{ .name }}" data-note="{{ .note }}">{{ .name }}</button>
            </li>
            {{ end }}
          </ul>
          {{ end }}
          <a href="https://instagram.com/{{ $.Site.Params.instagram.handle }}"
             class="btn-order" target="_blank" rel="noopener">
            Order on Instagram
          </a>
        </div>
      </div>
      {{ end }}
    </div>
  </div>

  <div class="variety-modal" id="variety-modal" hidden>
    <div class="variety-modal-backdrop" data-variety-close></div>
    <div class="variety-modal-panel" role="dialog" aria-modal="true"
         aria-labelledby="variety-modal-title">
      <button type="button" class="variety-modal-close" data-variety-close
              aria-label="Close">&times;</button>
      <h4 id="variety-modal-title"></h4>
      <p id="variety-modal-note"></p>
    </div>
  </div>
</section>
